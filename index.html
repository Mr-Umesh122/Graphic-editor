<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Poster Editor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="logo">
            Poster Editor
        </div>

        <div class="top-actions">
            <button id="undoBtn">Undo</button>
            <button id="redoBtn">Redo</button>
            <button id="exportBtn">Export</button>
        </div>

    </header>


    <main class="editor">

        <!-- LEFT TOOLBAR -->
        <aside class="sidebar left-sidebar">

            <button id="addTextBtn">
                Text
            </button>

            <button id="addRectBtn">
                Rectangle
            </button>

            <label class="upload-btn">
                Image

                <input type="file" id="imageInput" accept="image/*" hidden>
            </label>

        </aside>


        <!-- CANVAS -->
        <section class="canvas-area">

            <div class="canvas-wrapper">
                <canvas id="canvas"></canvas>
            </div>

        </section>


        <!-- PROPERTIES -->
        <aside class="sidebar right-sidebar">
        
            <h3>Properties</h3>
        
            <div id="properties" class="properties">
        
                <p class="no-selection">
                    Select an object
                </p>
        
                <div id="objectProperties" hidden>
        
                    <label>
                        Text
                        <input type="text" id="textInput">
                    </label>
        
                    <label>
                        Font Size
                        <input type="number" id="fontSizeInput">
                    </label>
        
                    <label>
                        Color
                        <input type="color" id="colorInput">
                    </label>
        
                    <label>
                        Opacity
                        <input type="range" id="opacityInput" min="0" max="1" step="0.01">
                    </label>
        
                    <label>
                        X
                        <input type="number" id="xInput">
                    </label>
        
                    <label>
                        Y
                        <input type="number" id="yInput">
                    </label>
        
                    <label>
                        Rotation
                        <input type="number" id="rotationInput">
                    </label>
        
                    <button id="deleteBtn" class="delete-btn">
                        Delete
                    </button>
        
                </div>
        
            </div>
            <div class="layers-section">
            
                <h3>Layers</h3>
            
                <div id="layersList"></div>
            
            </div>
        
        </aside>

    </main>


    <!-- Fabric.js -->
    <script src="https://cdn.jsdelivr.net/npm/fabric@6.7.1/dist/index.min.js"></script>

    <!-- Our application -->
    <script src="app.js"></script>

</body>

</html>
